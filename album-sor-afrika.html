<script>var lbImgs=[{src:"images/stories/albums/sor_afrika/1 Petrell ventar p__ tidevatnet.jpg",caption:"1 Petrell ventar p__ tidevatnet"},{src:"images/stories/albums/sor_afrika/10 Ein hyene kvilar etter ei lang natt.JPG",caption:"10 Ein hyene kvilar etter ei lang natt"},{src:"images/stories/albums/sor_afrika/11 Giraff og Frode.jpg",caption:"11 Giraff og Frode"},{src:"images/stories/albums/sor_afrika/12 Ein freidig bavian har satt seg p__ taket til ein golf.jpg",caption:"12 Ein freidig bavian har satt seg p__ taket til ein golf"},{src:"images/stories/albums/sor_afrika/13 Nashorn.JPG",caption:"13 Nashorn"},{src:"images/stories/albums/sor_afrika/15 Fire jenter i sofaen p__ julafta.jpg",caption:"15 Fire jenter i sofaen p__ julafta"},{src:"images/stories/albums/sor_afrika/16 Far og son med hodepryd.jpg",caption:"16 Far og son med hodepryd"},{src:"images/stories/albums/sor_afrika/16 Marit og Asbj__rn og grillspyd p__ Portugisisk restaurant.jpg",caption:"16 Marit og Asbj__rn og grillspyd p__ Portugisisk restaurant"},{src:"images/stories/albums/sor_afrika/18 Fredsprisvinnarar fr__ S__r Afrika_ bla Mandela og Desmond Tutu.jpg",caption:"18 Fredsprisvinnarar fr__ S__r Afrika_ bla Mandela og Desmond Tutu"},{src:"images/stories/albums/sor_afrika/18Jentene p__ veg til SPA klinikk i Durban.jpg",caption:"18Jentene p__ veg til SPA klinikk i Durban"},{src:"images/stories/albums/sor_afrika/19 Emma og Luke lagar soltak til oss.jpg",caption:"19 Emma og Luke lagar soltak til oss"},{src:"images/stories/albums/sor_afrika/2 Ein treng firhjulstrekkar for __ kome opp Sani Pass.jpg",caption:"2 Ein treng firhjulstrekkar for __ kome opp Sani Pass"},{src:"images/stories/albums/sor_afrika/3 Sani Pass_ p__ veg til Lesotho.jpg",caption:"3 Sani Pass_ p__ veg til Lesotho"},{src:"images/stories/albums/sor_afrika/4 Guiden v__r og Frode.jpg",caption:"4 Guiden v__r og Frode"},{src:"images/stories/albums/sor_afrika/5 Blomar p__ 3000 m_o_h_.jpg",caption:"5 Blomar p__ 3000 m_o_h_"},{src:"images/stories/albums/sor_afrika/6 Ein av gjetarane vi m__tte p__ vegen.jpg",caption:"6 Ein av gjetarane vi m__tte p__ vegen"},{src:"images/stories/albums/sor_afrika/7 Ein elefant kikkar opp bak buskene.JPG",caption:"7 Ein elefant kikkar opp bak buskene"},{src:"images/stories/albums/sor_afrika/8 L__ve.JPG",caption:"8 L__ve"},{src:"images/stories/albums/sor_afrika/9 Zebra.jpg",caption:"9 Zebra"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
