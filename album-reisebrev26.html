<script>var lbImgs=[{src:"images/stories/albums/reisebrev26/Cecilie-og-Therese.jpg",caption:"Cecilie-og-Therese"},{src:"images/stories/albums/reisebrev26/Didgeridoo.jpg",caption:"Didgeridoo"},{src:"images/stories/albums/reisebrev26/Havets-delikatesse___-pasta.jpg",caption:"Havets-delikatesse___-pasta"},{src:"images/stories/albums/reisebrev26/Kapteinen-holder-utkikk.jpg",caption:"Kapteinen-holder-utkikk"},{src:"images/stories/albums/reisebrev26/La-Familia-og-Petrell___Helan-og-Halvan.jpg",caption:"La-Familia-og-Petrell___Helan-og-Halvan"},{src:"images/stories/albums/reisebrev26/LaFamilia-sett-fra-Petrell.jpg",caption:"LaFamilia-sett-fra-Petrell"},{src:"images/stories/albums/reisebrev26/Marit-eeeelsker-hermetiserte-poelser.jpg",caption:"Marit-eeeelsker-hermetiserte-poelser"},{src:"images/stories/albums/reisebrev26/Marit-og-Frode-p__-Captain-Cooks-Lookout.jpg",caption:"Marit-og-Frode-p__-Captain-Cooks-Lookout"},{src:"images/stories/albums/reisebrev26/Marit-og-Therese.jpg",caption:"Marit-og-Therese"},{src:"images/stories/albums/reisebrev26/Paa-stranda-i-Darwin.jpg",caption:"Paa-stranda-i-Darwin"},{src:"images/stories/albums/reisebrev26/Paafyll.jpg",caption:"Paafyll"},{src:"images/stories/albums/reisebrev26/Petrell-i-fint-sig.jpg",caption:"Petrell-i-fint-sig"},{src:"images/stories/albums/reisebrev26/Petrell-i-slusen.jpg",caption:"Petrell-i-slusen"},{src:"images/stories/albums/reisebrev26/Solnedgang-i-Darwin_.jpg",caption:"Solnedgang-i-Darwin_"},{src:"images/stories/albums/reisebrev26/TP-gaar-til-hodet-p__-Therese.jpg",caption:"TP-gaar-til-hodet-p__-Therese"},{src:"images/stories/albums/reisebrev26/Therse-og-Yngve-trosser-regnveret.jpg",caption:"Therse-og-Yngve-trosser-regnveret"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
