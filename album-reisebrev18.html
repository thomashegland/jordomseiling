<script>var lbImgs=[{src:"images/stories/albums/reisebrev18/111_1126.jpg",caption:"111_1126"},{src:"images/stories/albums/reisebrev18/111_1130.jpg",caption:"111_1130"},{src:"images/stories/albums/reisebrev18/Ein_fin_liten_samling_skrukketroll.jpg",caption:"Ein_fin_liten_samling_skrukketroll"},{src:"images/stories/albums/reisebrev18/Frode_opnar_oystersskjell.jpg",caption:"Frode_opnar_oystersskjell"},{src:"images/stories/albums/reisebrev18/Kauehi_02_-_140704_047.jpg",caption:"Kauehi_02_-_140704_047"},{src:"images/stories/albums/reisebrev18/Kauehi_02_-_140704_058.jpg",caption:"Kauehi_02_-_140704_058"},{src:"images/stories/albums/reisebrev18/Kauehi_02_-_140704_078.jpg",caption:"Kauehi_02_-_140704_078"},{src:"images/stories/albums/reisebrev18/Kauehi_og_Fakarava_14_-_250704_039.jpg",caption:"Kauehi_og_Fakarava_14_-_250704_039"},{src:"images/stories/albums/reisebrev18/Kauehi_og_Fakarava_14_-_250704_045.jpg",caption:"Kauehi_og_Fakarava_14_-_250704_045"},{src:"images/stories/albums/reisebrev18/Kauehi_og_Fakarava_14_-_250704_066.jpg",caption:"Kauehi_og_Fakarava_14_-_250704_066"},{src:"images/stories/albums/reisebrev18/Kauehi_og_Fakarava_14_-_250704_088.jpg",caption:"Kauehi_og_Fakarava_14_-_250704_088"},{src:"images/stories/albums/reisebrev18/Kauehi_og_Fakarava_14_-_250704_111.jpg",caption:"Kauehi_og_Fakarava_14_-_250704_111"},{src:"images/stories/albums/reisebrev18/Kauehi_og_Fakarava_14_-_250704_112.jpg",caption:"Kauehi_og_Fakarava_14_-_250704_112"},{src:"images/stories/albums/reisebrev18/Marit_leitar_etter_perler.jpg",caption:"Marit_leitar_etter_perler"},{src:"images/stories/albums/reisebrev18/Moete_i_kvinneforeningen.jpg",caption:"Moete_i_kvinneforeningen"},{src:"images/stories/albums/reisebrev18/Petrell_under_segl.jpg",caption:"Petrell_under_segl"},{src:"images/stories/albums/reisebrev18/Vi_speider_etter_grunnar_fraa_toppen_av_masta.jpg",caption:"Vi_speider_etter_grunnar_fraa_toppen_av_masta"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
