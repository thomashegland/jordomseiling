<script>var lbImgs=[{src:"images/stories/albums/reisebrev04/001.jpg",caption:"001"},{src:"images/stories/albums/reisebrev04/002.jpg",caption:"002"},{src:"images/stories/albums/reisebrev04/003.jpg",caption:"003"},{src:"images/stories/albums/reisebrev04/004.jpg",caption:"004"},{src:"images/stories/albums/reisebrev04/005.jpg",caption:"005"},{src:"images/stories/albums/reisebrev04/006.jpg",caption:"006"},{src:"images/stories/albums/reisebrev04/007.jpg",caption:"007"},{src:"images/stories/albums/reisebrev04/008.jpg",caption:"008"},{src:"images/stories/albums/reisebrev04/009.jpg",caption:"009"},{src:"images/stories/albums/reisebrev04/010.jpg",caption:"010"},{src:"images/stories/albums/reisebrev04/011.jpg",caption:"011"},{src:"images/stories/albums/reisebrev04/012.jpg",caption:"012"},{src:"images/stories/albums/reisebrev04/013.jpg",caption:"013"},{src:"images/stories/albums/reisebrev04/014.jpg",caption:"014"},{src:"images/stories/albums/reisebrev04/015.jpg",caption:"015"},{src:"images/stories/albums/reisebrev04/016.jpg",caption:"016"},{src:"images/stories/albums/reisebrev04/017.jpg",caption:"017"},{src:"images/stories/albums/reisebrev04/018.jpg",caption:"018"},{src:"images/stories/albums/reisebrev04/019.jpg",caption:"019"},{src:"images/stories/albums/reisebrev04/020.jpg",caption:"020"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
