<script>var lbImgs=[{src:"images/stories/albums/reisebrev21/1-petrell-paa-land.jpg",caption:"1-petrell-paa-land"},{src:"images/stories/albums/reisebrev21/10-ferske-fersken.jpg",caption:"10-ferske-fersken"},{src:"images/stories/albums/reisebrev21/11-opp-og-opp.jpg",caption:"11-opp-og-opp"},{src:"images/stories/albums/reisebrev21/12-utsikt-fraa-mt_manaia.jpg",caption:"12-utsikt-fraa-mt_manaia"},{src:"images/stories/albums/reisebrev21/13-paa-toppen-av-mt_manaia.jpg",caption:"13-paa-toppen-av-mt_manaia"},{src:"images/stories/albums/reisebrev21/14-slutt-paa-biltrafikken.jpg",caption:"14-slutt-paa-biltrafikken"},{src:"images/stories/albums/reisebrev21/15-paa-camping.jpg",caption:"15-paa-camping"},{src:"images/stories/albums/reisebrev21/16-eviggroenn-teltlek.jpg",caption:"16-eviggroenn-teltlek"},{src:"images/stories/albums/reisebrev21/2-bunnsmoering-.jpg",caption:"2-bunnsmoering-"},{src:"images/stories/albums/reisebrev21/3-frode-og-motoren.jpg",caption:"3-frode-og-motoren"},{src:"images/stories/albums/reisebrev21/4-vi-har-kjoept-symaskin.jpg",caption:"4-vi-har-kjoept-symaskin"},{src:"images/stories/albums/reisebrev21/5-sportsfiskarane.jpg",caption:"5-sportsfiskarane"},{src:"images/stories/albums/reisebrev21/6-solskinn-og-vannmelon.jpg",caption:"6-solskinn-og-vannmelon"},{src:"images/stories/albums/reisebrev21/7-ein-vanleg-grillkveld-i-marinaen.jpg",caption:"7-ein-vanleg-grillkveld-i-marinaen"},{src:"images/stories/albums/reisebrev21/8-paa-veg-til-butikken-i-whangarei.jpg",caption:"8-paa-veg-til-butikken-i-whangarei"},{src:"images/stories/albums/reisebrev21/9-paa-sykkeltur-til-whangarei-heads.jpg",caption:"9-paa-sykkeltur-til-whangarei-heads"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
