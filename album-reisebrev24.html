<script>var lbImgs=[{src:"images/stories/albums/reisebrev24/ei-sjoeku-vi-moette-paa-oeya-epi.jpg",caption:"ei-sjoeku-vi-moette-paa-oeya-epi"},{src:"images/stories/albums/reisebrev24/ei-skilpadde-paa-epi.jpg",caption:"ei-skilpadde-paa-epi"},{src:"images/stories/albums/reisebrev24/eit-av-mange-kanobesoek-her-har-vi-bytta-til-oss-groensaker-for-ein-shorts.jpg",caption:"eit-av-mange-kanobesoek-her-har-vi-bytta-til-oss-groensaker-for-ein-shorts"},{src:"images/stories/albums/reisebrev24/fiji-til-vanuatu_-03---0708.jpg",caption:"fiji-til-vanuatu_-03---0708"},{src:"images/stories/albums/reisebrev24/fiji-til-vanuatu_-03---070805-019.jpg",caption:"fiji-til-vanuatu_-03---070805-019"},{src:"images/stories/albums/reisebrev24/kva-ein-regnversdag-kan-foere-til.jpg",caption:"kva-ein-regnversdag-kan-foere-til"},{src:"images/stories/albums/reisebrev24/kvinner-i-kokhuset-i-landsbyen-olal.jpg",caption:"kvinner-i-kokhuset-i-landsbyen-olal"},{src:"images/stories/albums/reisebrev24/marit-og-mr-mahi-mahi-paa-8-kg.jpg",caption:"marit-og-mr-mahi-mahi-paa-8-kg"},{src:"images/stories/albums/reisebrev24/paa-veg-til-oeya-ambrym-moette-vi-paa-denne-flokken-med-pilotkval.jpg",caption:"paa-veg-til-oeya-ambrym-moette-vi-paa-denne-flokken-med-pilotkval"},{src:"images/stories/albums/reisebrev24/stammedans-i-landsbyen-fala.jpg",caption:"stammedans-i-landsbyen-fala"},{src:"images/stories/albums/reisebrev24/to-jenter-paa-besoek-i-petrell.jpg",caption:"to-jenter-paa-besoek-i-petrell"},{src:"images/stories/albums/reisebrev24/vanuatu_-ambrym_-rom-dance.jpg",caption:"vanuatu_-ambrym_-rom-dance"},{src:"images/stories/albums/reisebrev24/vi-gjekk-paa-tur-til-vulkanen-paa-ambrym.jpg",caption:"vi-gjekk-paa-tur-til-vulkanen-paa-ambrym"},{src:"images/stories/albums/reisebrev24/vi-presser-ned-kava-i-kavabaren-paa-oeya-epi.jpg",caption:"vi-presser-ned-kava-i-kavabaren-paa-oeya-epi"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
