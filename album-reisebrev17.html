<script>var lbImgs=[{src:"images/stories/albums/reisebrev17/DSC03449.jpg",caption:"DSC03449"},{src:"images/stories/albums/reisebrev17/DSCN1765.jpg",caption:"DSCN1765"},{src:"images/stories/albums/reisebrev17/Marquesas__14-170604_011.jpg",caption:"Marquesas__14-170604_011"},{src:"images/stories/albums/reisebrev17/Marquesas__14-170604_041.jpg",caption:"Marquesas__14-170604_041"},{src:"images/stories/albums/reisebrev17/Marquesas__14-170604_075.jpg",caption:"Marquesas__14-170604_075"},{src:"images/stories/albums/reisebrev17/Marquesas__14-170604_084.jpg",caption:"Marquesas__14-170604_084"},{src:"images/stories/albums/reisebrev17/Project1.jpg",caption:"Project1"},{src:"images/stories/albums/reisebrev17/Ua_Pou_2606-_020704_014.jpg",caption:"Ua_Pou_2606-_020704_014"},{src:"images/stories/albums/reisebrev17/Ua_Pou_2606-_020704_031.jpg",caption:"Ua_Pou_2606-_020704_031"},{src:"images/stories/albums/reisebrev17/Ua_Pou_2606-_020704_032.jpg",caption:"Ua_Pou_2606-_020704_032"},{src:"images/stories/albums/reisebrev17/Ua_Pou_2606-_020704_062.jpg",caption:"Ua_Pou_2606-_020704_062"},{src:"images/stories/albums/reisebrev17/Ua_Pou_2606-_020704_066.jpg",caption:"Ua_Pou_2606-_020704_066"},{src:"images/stories/albums/reisebrev17/Ua_Pou_2606-_020704_072.jpg",caption:"Ua_Pou_2606-_020704_072"},{src:"images/stories/albums/reisebrev17/Ua_Pou__17_-_260604_001.jpg",caption:"Ua_Pou__17_-_260604_001"},{src:"images/stories/albums/reisebrev17/Ua_Pou__17_-_260604_007.jpg",caption:"Ua_Pou__17_-_260604_007"},{src:"images/stories/albums/reisebrev17/Ua_Pou__17_-_260604_023.jpg",caption:"Ua_Pou__17_-_260604_023"},{src:"images/stories/albums/reisebrev17/Ua_Pou__17_-_260604_050.jpg",caption:"Ua_Pou__17_-_260604_050"},{src:"images/stories/albums/reisebrev17/Ua_Pou__17_-_260604_051.jpg",caption:"Ua_Pou__17_-_260604_051"},{src:"images/stories/albums/reisebrev17/Ua_Pou__17_-_260604_067.jpg",caption:"Ua_Pou__17_-_260604_067"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
