ar_oss_trygt_i_land"},{src:"images/stories/albums/reisebrev10/20.jpg",caption:"20"},{src:"images/stories/albums/reisebrev10/21_ein_av_mange_edderkoppar_som_hang_i_trea.jpg",caption:"21_ein_av_mange_edderkoppar_som_hang_i_trea"},{src:"images/stories/albums/reisebrev10/22_vi_fann_litt_skugge.jpg",caption:"22_vi_fann_litt_skugge"},{src:"images/stories/albums/reisebrev10/23.jpg",caption:"23"},{src:"images/stories/albums/reisebrev10/24_lokale_fiskebaatar.jpg",caption:"24_lokale_fiskebaatar"},{src:"images/stories/albums/reisebrev10/25_pinnstiv_nordmann_har_litt_aa_laere.jpg",caption:"25_pinnstiv_nordmann_har_litt_aa_laere"},{src:"images/stories/albums/reisebrev10/26_dei_smaa__og_store__maaler_krefter.jpg",caption:"26_dei_smaa__og_store__maaler_krefter"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
