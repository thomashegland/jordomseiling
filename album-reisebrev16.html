<script>var lbImgs=[{src:"images/stories/albums/reisebrev16/Marit-og-skilpadden.jpg",caption:"Marit-og-skilpadden"},{src:"images/stories/albums/reisebrev16/Marit-og-skilpadden_2.jpg",caption:"Marit-og-skilpadden_2"},{src:"images/stories/albums/reisebrev16/en_liten_skilpadde.jpg",caption:"en_liten_skilpadde"},{src:"images/stories/albums/reisebrev16/frode-i-vulkangrotte.jpg",caption:"frode-i-vulkangrotte"},{src:"images/stories/albums/reisebrev16/frode-paa-skilpadderyggen.jpg",caption:"frode-paa-skilpadderyggen"},{src:"images/stories/albums/reisebrev16/frode_leser_greske_verker.jpg",caption:"frode_leser_greske_verker"},{src:"images/stories/albums/reisebrev16/krater-panorama.jpg",caption:"krater-panorama"},{src:"images/stories/albums/reisebrev16/skilpadder_parrer_seg.jpg",caption:"skilpadder_parrer_seg"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
