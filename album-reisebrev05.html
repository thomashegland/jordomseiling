<script>var lbImgs=[{src:"images/stories/albums/reisebrev05/23-Need-I-say-more.jpg",caption:"23-Need-I-say-more"},{src:"images/stories/albums/reisebrev05/29-Og-med-den-kommer-regnbuen.jpg",caption:"29-Og-med-den-kommer-regnbuen"},{src:"images/stories/albums/reisebrev05/33-Flott-kveldstur.jpg",caption:"33-Flott-kveldstur"},{src:"images/stories/albums/reisebrev05/37.jpg",caption:"37"},{src:"images/stories/albums/reisebrev05/40-Det-er-dejlig-aa-vaere-norsk_paa_havet.jpg",caption:"40-Det-er-dejlig-aa-vaere-norsk_paa_havet"},{src:"images/stories/albums/reisebrev05/41-Fornoyde.jpg",caption:"41-Fornoyde"},{src:"images/stories/albums/reisebrev05/42-Bryllupsrapport-fra-Lise-og-Steinar.jpg",caption:"42-Bryllupsrapport-fra-Lise-og-Steinar"},{src:"images/stories/albums/reisebrev05/43-Frode-lager-deilig-kvelds.jpg",caption:"43-Frode-lager-deilig-kvelds"},{src:"images/stories/albums/reisebrev05/45-Nachos-og-video-i-regnveret.jpg",caption:"45-Nachos-og-video-i-regnveret"},{src:"images/stories/albums/reisebrev05/47-Frode-er-som-vanlig-foerst-i-seng.jpg",caption:"47-Frode-er-som-vanlig-foerst-i-seng"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
