<script>var lbImgs=[{src:"images/stories/albums/Reisebrev 34/1 Caledoniakanalen.jpg",caption:"1 Caledoniakanalen"},{src:"images/stories/albums/Reisebrev 34/10 Champagnesprut.JPG",caption:"10 Champagnesprut"},{src:"images/stories/albums/Reisebrev 34/11 V__te av regn og champagne.JPG",caption:"11 V__te av regn og champagne"},{src:"images/stories/albums/Reisebrev 34/12 Velkomstkake.JPG",caption:"12 Velkomstkake"},{src:"images/stories/albums/Reisebrev 34/13 Hans gjer ein _Titanic_.JPG",caption:"13 Hans gjer ein _Titanic_"},{src:"images/stories/albums/Reisebrev 34/2 Trygt fort__yd p__ h__gfjellet.jpg",caption:"2 Trygt fort__yd p__ h__gfjellet"},{src:"images/stories/albums/Reisebrev 34/3 Fine turar langs kanalen_ saman med Ringhorne.jpg",caption:"3 Fine turar langs kanalen_ saman med Ringhorne"},{src:"images/stories/albums/Reisebrev 34/3 Plattform i Nordsj__en.jpg",caption:"3 Plattform i Nordsj__en"},{src:"images/stories/albums/Reisebrev 34/4 Ein solskinnsdag i Caledoniakanalen.jpg",caption:"4 Ein solskinnsdag i Caledoniakanalen"},{src:"images/stories/albums/Reisebrev 34/4 Soloppgang over Norge.jpg",caption:"4 Soloppgang over Norge"},{src:"images/stories/albums/Reisebrev 34/5 Simen __nsker oss velkomen heim.JPG",caption:"5 Simen __nsker oss velkomen heim"},{src:"images/stories/albums/Reisebrev 34/6 Velkomstkomiteen.jpg",caption:"6 Velkomstkomiteen"},{src:"images/stories/albums/Reisebrev 34/7 Anders Emil_ Anna og Lars p__ baugen.jpg",caption:"7 Anders Emil_ Anna og Lars p__ baugen"},{src:"images/stories/albums/Reisebrev 34/8 Simen overtar styringen.jpg",caption:"8 Simen overtar styringen"},{src:"images/stories/albums/Reisebrev 34/9 Flott velkomst i regnv__ret.JPG",caption:"9 Flott velkomst i regnv__ret"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
