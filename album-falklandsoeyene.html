<script>var lbImgs=[{src:"images/stories/albums/falklandsoeyene/8 aaring som sjaafoer.JPG",caption:"8 aaring som sjaafoer"},{src:"images/stories/albums/falklandsoeyene/Chris and King 2.JPG",caption:"Chris and King 2"},{src:"images/stories/albums/falklandsoeyene/DSC00778.JPG",caption:"DSC00778"},{src:"images/stories/albums/falklandsoeyene/DSC00810.JPG",caption:"DSC00810"},{src:"images/stories/albums/falklandsoeyene/DSC00814.JPG",caption:"DSC00814"},{src:"images/stories/albums/falklandsoeyene/DSC00830.JPG",caption:"DSC00830"},{src:"images/stories/albums/falklandsoeyene/DSC00841.JPG",caption:"DSC00841"},{src:"images/stories/albums/falklandsoeyene/DSC00854.JPG",caption:"DSC00854"},{src:"images/stories/albums/falklandsoeyene/DSC00923.JPG",caption:"DSC00923"},{src:"images/stories/albums/falklandsoeyene/DSC00936.JPG",caption:"DSC00936"},{src:"images/stories/albums/falklandsoeyene/DSC00954.JPG",caption:"DSC00954"},{src:"images/stories/albums/falklandsoeyene/DSC00963.JPG",caption:"DSC00963"},{src:"images/stories/albums/falklandsoeyene/DSC00978.JPG",caption:"DSC00978"},{src:"images/stories/albums/falklandsoeyene/DSC00997.JPG",caption:"DSC00997"},{src:"images/stories/albums/falklandsoeyene/DSC01035.JPG",caption:"DSC01035"},{src:"images/stories/albums/falklandsoeyene/DSC01043.JPG",caption:"DSC01043"},{src:"images/stories/albums/falklandsoeyene/East Jetty 1.JPG",caption:"East Jetty 1"},{src:"images/stories/albums/falklandsoeyene/Kelp Geese.JPG",caption:"Kelp Geese"},{src:"images/stories/albums/falklandsoeyene/King and Gentoos 2.JPG",caption:"King and Gentoos 2"},{src:"images/stories/albums/falklandsoeyene/Kings 12.JPG",caption:"Kings 12"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
