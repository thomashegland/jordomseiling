<script>var lbImgs=[{src:"images/stories/albums/reisebrev20/aa-basere-sightseeinga-paa-haiking-er-ikke-noe-sjekktrekk-paa-samoa.jpg",caption:"aa-basere-sightseeinga-paa-haiking-er-ikke-noe-sjekktrekk-paa-samoa"},{src:"images/stories/albums/reisebrev20/deep-blue.jpg",caption:"deep-blue"},{src:"images/stories/albums/reisebrev20/grisete-grisar-paa-tonga.jpg",caption:"grisete-grisar-paa-tonga"},{src:"images/stories/albums/reisebrev20/kapteinen-og-skipskatta-paa-petrell.jpg",caption:"kapteinen-og-skipskatta-paa-petrell"},{src:"images/stories/albums/reisebrev20/mor-og-son-viser-fram-to-kvalpar.jpg",caption:"mor-og-son-viser-fram-to-kvalpar"},{src:"images/stories/albums/reisebrev20/nysgjerrige-ungar-kikkar-paa-palangis-gjennom-vindauget.jpg",caption:"nysgjerrige-ungar-kikkar-paa-palangis-gjennom-vindauget"},{src:"images/stories/albums/reisebrev20/paa-middag-hos-landsbyhovdingen-paa-samoa.jpg",caption:"paa-middag-hos-landsbyhovdingen-paa-samoa"},{src:"images/stories/albums/reisebrev20/vi-faa-sjaa-korleis-tapa-vert-laga.jpg",caption:"vi-faa-sjaa-korleis-tapa-vert-laga"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
