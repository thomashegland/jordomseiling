<script>var lbImgs=[{src:"images/stories/albums/reisebrev32/Avskjedsseremoni p__ St_Helena.jpg",caption:"Avskjedsseremoni p__ St_Helena"},{src:"images/stories/albums/reisebrev32/Den berykta Jakobsstigen.JPG",caption:"Den berykta Jakobsstigen"},{src:"images/stories/albums/reisebrev32/Det obligatoriske biletet ved Napoleon si grav.JPG",caption:"Det obligatoriske biletet ved Napoleon si grav"},{src:"images/stories/albums/reisebrev32/Eine forseglet m__ b__tast.jpg",caption:"Eine forseglet m__ b__tast"},{src:"images/stories/albums/reisebrev32/Et frakteskip passerer med liten margin.jpg",caption:"Et frakteskip passerer med liten margin"},{src:"images/stories/albums/reisebrev32/Farvel til St_Helena.jpg",caption:"Farvel til St_Helena"},{src:"images/stories/albums/reisebrev32/Fest etter jordomseiling_.jpg",caption:"Fest etter jordomseiling_"},{src:"images/stories/albums/reisebrev32/Frode holder sverdet p__ black marlin.jpg",caption:"Frode holder sverdet p__ black marlin"},{src:"images/stories/albums/reisebrev32/Frode og Jonathan.jpg",caption:"Frode og Jonathan"},{src:"images/stories/albums/reisebrev32/Frode og Mr_Dorado.jpg",caption:"Frode og Mr_Dorado"},{src:"images/stories/albums/reisebrev32/Frode p__ radioen.jpg",caption:"Frode p__ radioen"},{src:"images/stories/albums/reisebrev32/Kanon-lunsj med LaFamilia.jpg",caption:"Kanon-lunsj med LaFamilia"},{src:"images/stories/albums/reisebrev32/Marit sjekker ut kanonen.jpg",caption:"Marit sjekker ut kanonen"},{src:"images/stories/albums/reisebrev32/Seiling i Karibien.JPG",caption:"Seiling i Karibien"},{src:"images/stories/albums/reisebrev32/Snart oppe.JPG",caption:"Snart oppe"},{src:"images/stories/albums/reisebrev32/Stillebeltet___.jpg",caption:"Stillebeltet___"},{src:"images/stories/albums/reisebrev32/Svell p__ ankringen.jpg",caption:"Svell p__ ankringen"},{src:"images/stories/albums/reisebrev32/Utsikt over down town St_Helena.jpg",caption:"Utsikt over down town St_Helena"},{src:"images/stories/albums/reisebrev32/Utsikt over havet.jpg",caption:"Utsikt over havet"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
