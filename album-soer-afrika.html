<script>var lbImgs=[{src:"images/stories/albums/soer_afrika/Akevitt h__rer med.jpg",caption:"Akevitt h__rer med"},{src:"images/stories/albums/soer_afrika/Elefant.jpg",caption:"Elefant"},{src:"images/stories/albums/soer_afrika/En varm og fin dukkert f__r middag.jpg",caption:"En varm og fin dukkert f__r middag"},{src:"images/stories/albums/soer_afrika/Frode flodhest.jpg",caption:"Frode flodhest"},{src:"images/stories/albums/soer_afrika/Giraff.jpg",caption:"Giraff"},{src:"images/stories/albums/soer_afrika/Giraffer og andre duer.jpg",caption:"Giraffer og andre duer"},{src:"images/stories/albums/soer_afrika/Lokale Zulukvinner.jpg",caption:"Lokale Zulukvinner"},{src:"images/stories/albums/soer_afrika/Marit m__ter gjetere i Lesotho.jpg",caption:"Marit m__ter gjetere i Lesotho"},{src:"images/stories/albums/soer_afrika/Marit pr__ver nesehorn sko.jpg",caption:"Marit pr__ver nesehorn sko"},{src:"images/stories/albums/soer_afrika/P__ vei opp Sanipass til Lesotho.jpg",caption:"P__ vei opp Sanipass til Lesotho"},{src:"images/stories/albums/soer_afrika/Pinnekj__tt i S__rafrika.jpg",caption:"Pinnekj__tt i S__rafrika"},{src:"images/stories/albums/soer_afrika/T__ffe elvestryk.jpg",caption:"T__ffe elvestryk"},{src:"images/stories/albums/soer_afrika/Under oppl__ring.jpg",caption:"Under oppl__ring"},{src:"images/stories/albums/soer_afrika/V__r nye guide.JPG",caption:"V__r nye guide"},{src:"images/stories/albums/soer_afrika/Zebra.jpg",caption:"Zebra"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
