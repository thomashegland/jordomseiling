<script>var lbImgs=[{src:"images/stories/albums/avskjed/10_ut_vaagen_1.jpg",caption:"10_ut_vaagen_1"},{src:"images/stories/albums/avskjed/11_ut_vaagen_2.jpg",caption:"11_ut_vaagen_2"},{src:"images/stories/albums/avskjed/12_i_vatlestraumen.jpg",caption:"12_i_vatlestraumen"},{src:"images/stories/albums/avskjed/1_avskjed_1_stort.jpg",caption:"1_avskjed_1_stort"},{src:"images/stories/albums/avskjed/2_det_lykkelige_paret_foer_avreise.jpg",caption:"2_det_lykkelige_paret_foer_avreise"},{src:"images/stories/albums/avskjed/3_mange_vil_se_i_baaten.jpg",caption:"3_mange_vil_se_i_baaten"},{src:"images/stories/albums/avskjed/4_stolt_kaptein_klar_til_avreise.jpg",caption:"4_stolt_kaptein_klar_til_avreise"},{src:"images/stories/albums/avskjed/5_stolt_par_klar_til_avreise.jpg",caption:"5_stolt_par_klar_til_avreise"},{src:"images/stories/albums/avskjed/6_intervju.jpg",caption:"6_intervju"},{src:"images/stories/albums/avskjed/7_intervju_ferdig.jpg",caption:"7_intervju_ferdig"},{src:"images/stories/albums/avskjed/8_pappa_paa_siste_inspeksjo.jpg",caption:"8_pappa_paa_siste_inspeksjo"},{src:"images/stories/albums/avskjed/8_pappa_paa_siste_inspeksjon.jpg",caption:"8_pappa_paa_siste_inspeksjon"},{src:"images/stories/albums/avskjed/9_starten_stort.jpg",caption:"9_starten_stort"},{src:"images/stories/albums/avskjed/avskjed_1_stort.jpg",caption:"avskjed_1_stort"},{src:"images/stories/albums/avskjed/starten_stort.jpg",caption:"starten_stort"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
