<script>var lbImgs=[{src:"images/stories/albums/reisebrev19/bursdagskake_med_lys.jpg",caption:"bursdagskake_med_lys"},{src:"images/stories/albums/reisebrev19/forsyningsskipet_er_perfekt_leikestativ.jpg",caption:"forsyningsskipet_er_perfekt_leikestativ"},{src:"images/stories/albums/reisebrev19/frode_er_klar_for_undervannsjakt.jpg",caption:"frode_er_klar_for_undervannsjakt"},{src:"images/stories/albums/reisebrev19/frode_freistar_fiskelukka_med_hell.jpg",caption:"frode_freistar_fiskelukka_med_hell"},{src:"images/stories/albums/reisebrev19/frode_holder_utkikk.jpg",caption:"frode_holder_utkikk"},{src:"images/stories/albums/reisebrev19/kollo_og_marit.jpg",caption:"kollo_og_marit"},{src:"images/stories/albums/reisebrev19/marit_og_a_a_mee_klare_for_kyrkja.jpg",caption:"marit_og_a_a_mee_klare_for_kyrkja"},{src:"images/stories/albums/reisebrev19/popcornfest_i_petrell.jpg",caption:"popcornfest_i_petrell"},{src:"images/stories/albums/reisebrev19/pua_og_andrea.jpg",caption:"pua_og_andrea"},{src:"images/stories/albums/reisebrev19/tomakhao_visar_oss_korleis_vi_skal_reinske_crayfisk.jpg",caption:"tomakhao_visar_oss_korleis_vi_skal_reinske_crayfisk"}];
(function(){
  var imgs=[],cur=0;
  var ov=document.getElementById('lb-overlay');
  var im=document.getElementById('lb-img');
  var cap=document.getElementById('lb-caption');
  function show(i){
    cur=((i%imgs.length)+imgs.length)%imgs.length;
    im.src=imgs[cur].src;
    cap.textContent=imgs[cur].caption||'';
    ov.classList.add('open');
  }
  document.getElementById('lb-close').onclick=function(){ov.classList.remove('open');im.src='';};
  document.getElementById('lb-prev').onclick=function(){show(cur-1);};
  document.getElementById('lb-next').onclick=function(){show(cur+1);};
  ov.addEventListener('click',function(e){if(e.target===ov){ov.classList.remove('open');im.src='';}});
  document.addEventListener('keydown',function(e){
    if(!ov.classList.contains('open'))return;
    if(e.key==='ArrowRight')show(cur+1);
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='Escape'){ov.classList.remove('open');im.src='';}
  });
  window.lbOpen=function(arr,i){imgs=arr;show(i);};
})();
</script>
